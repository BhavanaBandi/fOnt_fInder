# Font Recognition Pipeline Configuration

# Dataset paths
dataset:
  root: "./font_project_dataset"
  train_dir: "./font_project_dataset/data/splits/train"
  val_dir: "./font_project_dataset/data/splits/val"
  test_dir: "./font_project_dataset/data/splits/test"
  metadata_csv: "./font_project_dataset/metadata.csv"
  num_classes: 3812

# Image preprocessing
preprocessing:
  image_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  grayscale: false
  normalize_contrast: true

# Text detection settings
detection:
  model: "db_resnet50"  # Options: db_resnet50, db_mobilenet_v3_large, fast_base
  min_confidence: 0.5
  crop_padding: 5
  output_dir: "./outputs/crops"

# Training settings
training:
  seed: 42
  batch_size: 32
  num_workers: 4
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  mixed_precision: true
  gradient_clip: 1.0
  early_stopping_patience: 10
  
# Model-specific configs
models:
  vit:
    name: "vit_base_patch16_224"
    pretrained: true
    drop_rate: 0.1
    
  deit:
    name: "deit_base_patch16_224"
    pretrained: true
    drop_rate: 0.1
    
  hybrid:
    backbone: "convnext_tiny"
    transformer_dim: 384
    num_heads: 6
    num_layers: 4
    pretrained_backbone: true
    
  fastervit:
    embed_dim: 96
    depths: [2, 2, 6, 2]
    num_heads: [3, 6, 12, 24]
    window_size: 7
    
  mobilenetv3:
    name: "mobilenetv3_large_100"
    pretrained: true
    
  convnext_tiny:
    name: "convnext_tiny"
    pretrained: true
    
  tinyvit:
    name: "tiny_vit_5m_224"
    pretrained: true

# Inference settings
inference:
  default_model: "hybrid"
  batch_size: 16
  device: "cuda"
  
# Logging
logging:
  log_dir: "./outputs/logs"
  tensorboard: true
  wandb: false
  save_frequency: 5

# Model registry
registry:
  path: "./models/registry.json"
  checkpoints_dir: "./models/checkpoints"
